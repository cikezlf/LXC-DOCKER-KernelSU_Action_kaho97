name: 低端机 谷歌clang14
on:
  workflow_dispatch:

jobs:
  build:
    name: 开始
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    
    steps:
    - uses: actions/checkout@v3
    
    - name: 环境变量配置
      run: |
        cat config.env | grep KERNEL_SOURCE= >> $GITHUB_ENV
        cat config.env | grep KERNEL_SOURCE_BRANCH= >> $GITHUB_ENV
        cat config.env | grep KERNEL_CONFIG= >> $GITHUB_ENV
        cat config.env | grep KERNEL_ZIP_NAME= >> $GITHUB_ENV
        cat config.env | grep LLVM_CONFIG= >> $GITHUB_ENV
        cat config.env | grep ENABLE_KERNELSU= >> $GITHUB_ENV
        cat config.env | grep KERNELSU_TAG= >> $GITHUB_ENV
        cat config.env | grep ENABLE_KVM= >> $GITHUB_ENV
        cat config.env | grep ENABLE_LXC_DOCKER= >> $GITHUB_ENV

    - name: 构建编译内核环境
      run: |
        sudo apt-get update
        sudo -E apt-get -y -qq install git make bc bison ccache openssl zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    
    - name: 下载Clang-aosp编译器
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir clang-aosp
        git clone -q --depth=1 --single-branch https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android13-release clang-aosp
    
    
    - name: 下载内核源码
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1
                  
    
    - name: 开启lxc和docker配置
      if: env.ENABLE_LXC_DOCKER == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        # wget https://github.com/fate-think/LXC-DOCKER-KernelSU_Action/releases/download/1.0.0/add-lxc-docker-custom.sh
        chmod 755 $GITHUB_WORKSPACE/add-lxc-docker-custom.sh
        # .$GITHUB_WORKSPACE/add-lxc-docker-custom.sh android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        bash "$GITHUB_WORKSPACE/add-lxc-docker-custom.sh" "android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}"
        echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> "android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}"

    # - name: 添加runc补丁
    #   run: |
    #     cd $GITHUB_WORKSPACE/kernel_workspace
    #     # wget https://github.com/fate-think/LXC-DOCKER-KernelSU_Action/releases/download/1.0.0/runcpatch.sh
    #     chmod a+x $GITHUB_WORKSPACE/runcpatch.sh
    #     if [ -f android-kernel/kernel/cgroup.c ]; then
    #     bash "$GITHUB_WORKSPACE/runcpatch.sh" android-kernel/kernel/cgroup.c              
    #     fi
    #     if [ -f android-kernel/kernel/cgroup/cgroup.c ]; then
    #     bash "$GITHUB_WORKSPACE/runcpatch.sh" android-kernel/kernel/cgroup/cgroup.c              
    #     fi
        
    #- name: 配置 ksu
    #  if: env.ENABLE_KERNELSU == 'true'
    #  run: |
    #    cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
    #    curl -LSs "https://raw.githubusercontent.com/kaho97/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy

      # ==================== 第六步：KernelSU-Next集成 ====================
    - name: 【KernelSU】部署KernelSU-Next Legacy驱动（本地脚本版，无404）
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        cp $GITHUB_WORKSPACE/ksu-legacy-setup.sh ./
        chmod 755 ksu-legacy-setup.sh
        ./ksu-legacy-setup.sh
        grep -q "CONFIG_KSU" "arch/arm64/configs/${{ env.KERNEL_CONFIG }}" || echo "CONFIG_KSU=y" >> "arch/arm64/configs/${{ env.KERNEL_CONFIG }}"
        echo "[✓] KernelSU-Next Legacy驱动部署完成"



    # - name: 开启kvm
    #   if: env.ENABLE_KVM == 'true'
    #   run: |
    #      cd $GITHUB_WORKSPACE/kernel_workspace
    #      echo "CONFIG_VIRTUALIZATION=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
    #      echo "CONFIG_KVM=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
    #      echo "CONFIG_VHOST_NET=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
    #      echo "CONFIG_VHOST_CROSS_ENDIAN_LEGACY=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
                
    # - name: 设置ccache缓存
    #   uses: hendrikmuhs/ccache-action@v1.2
    #   with:
    #     key: build-kernel-mido-kernel
    #     max-size: 2G


    # ==================== 第八步：内核编译 ====================
    - name: 【编译】最终同步内核配置
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        make O=out ARCH=arm64 olddefconfig
        echo "[✓] 最终内核配置同步完成"

    - name: 【编译】正式编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin:$PATH
        export KBUILD_BUILD_HOST=HyperPower
        export KBUILD_BUILD_USER=MI6-FullFunction
        if [ "${{ env.LLVM_CONFIG }}" = "y" ]; then
          make -j$(nproc --all) CC="ccache clang" O=out ARCH=arm64 \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
            KCFLAGS="-Wno-error" \
            LLVM=1 LLVM_IAS=1 2>&1 | tee build.log
        else
          make -j$(nproc --all) CC="ccache clang" O=out ARCH=arm64 \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
            KCFLAGS="-Wno-error" 2>&1 | tee build.log
        fi
        echo "[✓] 内核编译完成"

    # ==================== 第九步：打包可刷入镜像 ====================
    - name: 【打包】制作 AnyKernel3 刷机包
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=/dev/block/bootdevice/by-name/boot;!g' anykernel.sh
        sed -i 's!/dev/block/platform/omap/omap_hsmmc\.0!/dev/block/bootdevice!g' anykernel.sh
        sed -i 's/is_slot_device=1;/is_slot_device=0;/g' anykernel.sh
        sed -i 's/device.name1=maguro/device.name1=sagit/g' anykernel.sh
        sed -i 's/device.name2=toro/device.name2=/g' anykernel.sh
        sed -i 's/device.name3=toroplus/device.name3=/g' anykernel.sh
        sed -i 's/device.name4=tuna/device.name4=/g' anykernel.sh
        sed -i '/init.tuna.rc/d' anykernel.sh
        sed -i '/fstab.tuna/d' anykernel.sh
        sed -i '/replace_string init.rc/d' anykernel.sh
        sed -i '/insert_line init.tuna/d' anykernel.sh
        sed -i '/patch_fstab fstab.tuna/d' anykernel.sh
        sed -i '/append_file init.tuna/d' anykernel.sh
        sed -i '/append_file fstab.tuna/d' anykernel.sh
        sed -i '/bootscript/d' anykernel.sh
        sed -i '/usbdisk/d' anykernel.sh
        cd ..
        cp android-kernel/out/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }} AnyKernel3/
        rm -rf AnyKernel3/.git* AnyKernel3/README.md AnyKernel3/ramdisk AnyKernel3/modules AnyKernel3/patch
        echo "[✓] 可刷入刷机包打包完成"

    # ==================== 第十步：产物上传 ====================
    - name: 【上传】内核刷机包
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.KERNEL_ZIP_NAME }}
        path: kernel_workspace/AnyKernel3/*

    - name: 【上传】编译日志
      uses: actions/upload-artifact@v4
      with:
        name: 内核构建日志
        path: kernel_workspace/android-kernel/build.log
        if-no-files-found: warn
